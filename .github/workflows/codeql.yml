name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 1'
  # Manual trigger: a crashed runner leaves the branch with a red CodeQL check and no way
  # back in without a push. This gives anyone with Actions access a "Run workflow" button.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Prepare debug keystore
      run: |
        # No release secrets are available in this workflow, so the debug build falls back
        # to the standard Android debug key. Without it `validateSigning*` fails and the
        # whole analysis run goes red.
        mkdir -p "$HOME/.android"
        keytool -genkeypair \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -validity 10000

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Build project
      run: |
        chmod +x gradlew
        # One variant is enough for the analysis: `assembleDebug` would build every
        # abi x variant combination (10 variants).
        ./gradlew assembleArm64FossDebug

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
