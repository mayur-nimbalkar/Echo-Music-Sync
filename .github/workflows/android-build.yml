name: Android CI

on:
  push:
    branches: [ "main" ]
    # A version tag publishes a release (see the `release` job).
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger, so a runner hiccup can be re-run from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

    - name: Prepare signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        # Same mechanism as the official Echo Music build: one permanent keystore lives in
        # repository secrets and is only decoded on the runner. Never commit it. Debug and
        # release are both signed with this single identity, so a new APK always installs
        # straight over the previously installed one.
        if [ -n "$KEYSTORE_BASE64" ]; then
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "Signing with the permanent keystore from KEYSTORE_BASE64."
        else
          # No secrets configured yet. Build with a throwaway key anyway so the code is
          # still compiled and its artifacts can be measured, then fail the run at the end:
          # an APK signed with a per-run key can never update an installed app, and shipping
          # one is exactly the bug this workflow used to have.
          echo "THROWAWAY_SIGNING=true" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore keystore.jks \
            -storepass android -alias echomusic -keypass android \
            -dname "CN=Echo Music Fork,O=mayur-nimbalkar,C=IN" \
            -keyalg RSA -keysize 4096 -validity 10000
          KEY_ALIAS=echomusic
          KEY_PASSWORD=android
          STORE_PASSWORD=android
          echo "::warning::KEYSTORE_BASE64 is not set - building with a throwaway key."
        fi

        # Consumed by the signing configs in app/build.gradle.kts.
        {
          echo "KEY_ALIAS=$KEY_ALIAS"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
          echo "STORE_PASSWORD=$STORE_PASSWORD"
        } >> "$GITHUB_ENV"

    # The unit tests were never run by CI, which is how two real parser bugs (duplicate
    # query candidates, and "Mr." being mistaken for an Instagram handle) shipped
    # unnoticed in earlier releases. They are fast and pure-JVM.
    - name: Run unit tests
      run: |
        chmod +x gradlew
        ./gradlew :core:testDebugUnitTest :lyrics:testDebugUnitTest testArm64GmsDebugUnitTest \
          -Pkotlin.daemon.jvmargs=-Xmx6g

    # Releases ship exactly two APKs: the universal stable build and the universal debug build.
    # One ABI-independent APK per build type means no device can be left without a compatible
    # asset (the arm64-only builds used to do that on 32-bit phones), and the updater picks the
    # asset of the install's own build type. The gms flavor is deliberate: the foss flavor
    # removes REQUEST_INSTALL_PACKAGES (F-Droid policy) and the Cast provider, and this fork's
    # whole point is installing its own updates.
    - name: Build APKs (universal debug + universal stable)
      run: |
        ./gradlew assembleUniversalGmsDebug assembleUniversalGmsRelease \
          -Pkotlin.daemon.jvmargs=-Xmx6g

    # A release can only update an installed app when it is signed with the SAME certificate.
    # A rebuilt or renewed keystore produces perfectly good APKs that install nowhere, and the
    # only symptom the user ever sees is Android's bare "App not installed". Check that both
    # APKs are signed, by one key, and by the fingerprint this fork has always shipped with.
    #
    # The fingerprint is committed here on purpose: rotating the signing key must be a visible
    # change in review, not a side effect of the keystore secret being replaced. Set the
    # SIGNING_CERT_SHA256 repository variable to override it.
    - name: Verify signing certificate
      env:
        PINNED_CERT: ${{ vars.SIGNING_CERT_SHA256 }}
        COMMITTED_CERT: a2502f2fd12aa1d66d6b29e292efc17344c57d3d3fa4d52d66ad8596b82b395b
      run: |
        set -euo pipefail
        APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
        digest() {
          { "$APKSIGNER" verify --print-certs "$1" 2>&1 || true; } |
            sed -n 's/.*certificate SHA-256 digest: *//p' |
            head -1 | tr -d ':' | tr 'A-F' 'a-f'
        }
        DBG="$(find app/build/outputs/apk -name 'app-universal-gms-debug.apk' | head -1)"
        REL="$(find app/build/outputs/apk -name 'app-universal-gms-release.apk' | head -1)"
        DBG_CERT="$(digest "$DBG")"
        REL_CERT="$(digest "$REL")"
        if [ -z "$DBG_CERT" ] || [ -z "$REL_CERT" ]; then
          echo "::error::An APK is unsigned or fails signature verification, so it can never install over an existing app."
          exit 1
        fi
        if [ "$DBG_CERT" != "$REL_CERT" ]; then
          echo "::error::The two APKs are signed with different keys ($DBG_CERT vs $REL_CERT)."
          exit 1
        fi
        echo "Signing certificate SHA-256: $DBG_CERT"
        {
          echo "### Signing certificate"
          echo '```'
          echo "$DBG_CERT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        PINNED="$(printf '%s' "${PINNED_CERT:-$COMMITTED_CERT}" | tr -d ':' | tr 'A-F' 'a-f')"
        if [ "$DBG_CERT" != "$PINNED" ]; then
          echo "::error::The APKs are signed with $DBG_CERT, but this fork updates with $PINNED. An app can only be updated by the key it was installed with: restore the original keystore, or change the pinned fingerprint deliberately."
          exit 1
        fi
        echo "Certificate matches the pinned fingerprint."

    # The in-app updater finds a release APK only by its exact asset name
    # (Echo-Music-<tag>-<arm64|universal>-<debug|stable>.apk, see UpdateAssetPicker.assetName).
    # Nothing else in CI would notice a version string that cannot sit in a filename, or an
    # artifact renamed differently at publish time - the release would simply stop reaching
    # every installed app. Fail here instead, and print the exact names to publish.
    - name: Verify release asset naming
      run: |
        set -euo pipefail
        AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
        APK="$(find app/build/outputs/apk -name 'app-universal-gms-release.apk' | head -1)"
        test -n "$APK"
        VERSION="$("$AAPT2" dump badging "$APK" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
        echo "versionName = $VERSION"
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z._-]+$'; then
          echo "::error::versionName '$VERSION' cannot be used in a release asset name"
          exit 1
        fi
        # Exactly two assets, one per build type, both universal (see the build step above).
        for type in stable debug; do
          asset="Echo-Music-v$VERSION-universal-$type.apk"
          if ! printf '%s' "$asset" | grep -Eq '^Echo-Music-[^-]+-(arm64|universal)-(debug|stable)\.apk$'; then
            echo "::error::'$asset' does not match the updater's asset naming scheme"
            exit 1
          fi
          echo "Publish the universal $type APK as: $asset"
        done

    - name: Upload universal Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: Echo-Music-universal-Debug-APK
        path: app/build/outputs/apk/**/app-universal-gms-debug.apk
        if-no-files-found: error

    - name: Upload universal Stable APK
      uses: actions/upload-artifact@v7
      with:
        name: Echo-Music-universal-Stable-APK
        path: app/build/outputs/apk/**/app-universal-gms-release.apk
        if-no-files-found: error

    - name: Require permanent signing
      if: env.THROWAWAY_SIGNING == 'true'
      run: |
        echo "::error::KEYSTORE_BASE64 is not set, so the APKs from this run are signed with a throwaway key and cannot update an installed app. Add KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD and STORE_PASSWORD under Settings -> Secrets and variables -> Actions and re-run this workflow. The artifacts above are build verification only - do not ship them."
        exit 1

  # Pushing a version tag publishes that build. The release carries exactly two files — the
  # universal stable APK and the universal debug APK — because those are the only assets the
  # in-app updater can use: it picks the asset matching the install's build type, and a
  # universal APK runs on every ABI. No checksums, no changelog.json: release notes are the
  # release body, which the app already falls back to.
  release:
    name: Publish release (universal stable + debug)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download built APKs
      uses: actions/download-artifact@v7
      with:
        pattern: Echo-Music-universal-*-APK
        path: artifacts

    - name: Name APKs for the updater
      run: |
        set -euo pipefail
        TAG="${{ github.ref_name }}"
        mkdir -p dist
        DEBUG_APK="$(find artifacts -name 'app-universal-gms-debug.apk' | head -1)"
        STABLE_APK="$(find artifacts -name 'app-universal-gms-release.apk' | head -1)"
        test -n "$DEBUG_APK" && test -n "$STABLE_APK"
        cp "$DEBUG_APK" "dist/Echo-Music-$TAG-universal-debug.apk"
        cp "$STABLE_APK" "dist/Echo-Music-$TAG-universal-stable.apk"
        ls -1 dist

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TAG="${{ github.ref_name }}"
        # This job never checks the repository out, so `gh` has no git remote to infer the
        # repository from and every gh release call fails with "fatal: not a git repository".
        # That is how v1.4.3.4's tag ended up with no release at all. Pass it explicitly.
        REPO="$GITHUB_REPOSITORY"
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          # Re-running the workflow for an existing tag replaces the two assets instead of
          # failing, so a rebuilt APK can always be published.
          gh release upload "$TAG" dist/*.apk --repo "$REPO" --clobber
        else
          gh release create "$TAG" dist/*.apk \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --latest
        fi
        gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
